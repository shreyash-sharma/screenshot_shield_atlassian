modules:
  jira:issuePanel:
    - key: screenshot-shield-panel
      resource: main
      resolver:
        function: resolver
      title: Screenshot Shield
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      viewportSize: xlarge
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/panel/dist
app:
  runtime:
    name: nodejs22.x
    memoryMB: 512
  id: ari:cloud:ecosystem::app/a137a727-27f8-46c0-9de3-e577d4dad329
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  content:
    styles:
      - unsafe-inline
    scripts:
      - unsafe-eval
      - "blob:"
